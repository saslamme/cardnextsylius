"cardnext.storefront.printer_advisor.guide.eyebrow": "Vägledning inför köpet"
"cardnext.storefront.printer_advisor.guide.title": "Guide till kortskrivare: detta bör ni tänka på"
"cardnext.storefront.printer_advisor.guide.lead": "Valet av kortskrivare handlar om mer än priset. Utskriftsvolym, kortfunktioner, säkerhetskrav och kodning är avgörande. Rätt system sparar tid, material och onödiga investeringar på sikt."
"cardnext.storefront.printer_advisor.guide.intro": "Är ni osäkra på vilken skrivare som passar hjälper vår interaktiva guide er snabbt vidare med några riktade frågor."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Gå till kortskrivarguiden"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Planera utskriftsvolymen"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. Den planerade utskriftsvolymen är avgörande"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "Årsvolymen avgör om en kompakt skrivare räcker eller om hastighet, tålighet och användarvänlighet blir viktigare."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "En underdimensionerad skrivare når snabbt sin gräns; ett högpresterande system är ofta olönsamt vid små volymer."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "Guiden frågar detta först eftersom det påverkar produktvalet kraftigt."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Enkelsidigt eller duplex"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. Utskrift på en eller båda sidor?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "Enkelsidig utskrift räcker ofta för enkla kund- eller besökskort. Information, streckkoder eller personalisering på baksidan kräver duplex."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "Automatisk duplex tar bort manuella moment och effektiviserar regelbunden kortproduktion."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Ange enkel- eller dubbelsidigt så att endast lämpliga system tas med."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Smart kortkodning"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. Ska kortet bara skrivas ut eller även kodas?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "Passersystem, tidrapportering och identifiering kräver ofta mer än en synlig utskrift."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "Magnetremsa, kontaktchip och RFID/NFC har olika krav, och alla skrivare stöder inte varje kodning."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "Guiden begränsar urvalet efter den kodning ni behöver."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Utskriftskvalitet och skydd"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Direktkort, retransfer och laminering förklarat"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "Direktkortutskrift är en ekonomisk och beprövad lösning för många standardtillämpningar."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Retransfer ger förstklassiga kantlösa motiv på krävande ytor, medan laminering skyddar mot slitage, UV och daglig användning."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "Kraven används för att skilja instegsmodeller från professionella system."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Långsiktig ekonomi"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. Vilken roll spelar budgeten?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "Inköpspriset är inte allt; systemet ska passa långsiktigt och klara framtida behov."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Större volymer, duplex, kodning eller säkerhetskrav motiverar ofta en mer kapabel modell."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "Guiden tar hänsyn till investeringsramen och visar lämpliga rekommendationer och alternativ."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Fatta ett tryggt beslut"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. Bra rådgivning sparar tid och förebygger felköp"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Valet av skrivare definierar även arbetsflödet. Tydliga krav förebygger felköp och onödiga uppgraderingar."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "Guiden strukturerar vanliga krav och hittar snabbare lämpliga modeller. För specialprojekt är personlig rådgivning bästa nästa steg."
