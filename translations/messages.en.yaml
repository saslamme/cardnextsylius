"cardnext.storefront.printer_advisor.guide.eyebrow": "Guidance before you buy"
"cardnext.storefront.printer_advisor.guide.title": "Card printer guide: what to consider before buying"
"cardnext.storefront.printer_advisor.guide.lead": "Choosing a card printer involves more than price. Print volume, card functions, security requirements and encoding all matter. The right system saves time, materials and unnecessary investment in the long term."
"cardnext.storefront.printer_advisor.guide.intro": "If you are unsure which system fits your application, our interactive advisor will quickly guide you with a few focused questions."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Go to the card printer advisor"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Plan print volume"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. Planned print volume is a key factor"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "Annual volume determines whether a compact desktop unit is sufficient or whether speed, durability and ease of use become more important."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "An undersized printer quickly reaches its limits; a high-performance system is often uneconomical for small batches."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "The advisor asks this first because it has a major impact on product selection."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Single-sided or duplex"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. Single- or double-sided card printing?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "Single-sided printing is often enough for simple loyalty or visitor cards. Information, barcodes or personalization on the reverse call for duplex."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "Automatic duplex printing removes manual steps and streamlines regular card production."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Specify single- or double-sided printing so only suitable systems are considered."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Encode smart cards"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. Printing only, or encoding too?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "Access control, time recording and identification often require more than a visible print image."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "Magnetic stripe, contact chip and RFID/NFC have different requirements, and not every printer supports every encoding option."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "The advisor narrows the selection according to the encoding you need."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Print quality & protection"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Direct-to-card, retransfer and lamination explained"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "Direct-to-card printing is an economical, proven choice for many standard applications."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Retransfer produces premium edge-to-edge images on demanding surfaces, while lamination protects against wear, UV and daily use."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "The advisor uses these requirements to distinguish entry-level and professional systems."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Long-term value"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. What role does the budget play?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "Purchase price is not the only consideration: the system must remain fit for purpose and accommodate future requirements."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Higher volumes, duplex, encoding or security needs often justify investing in a more capable model."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "The advisor considers your investment range and shows suitable recommendations and alternatives."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Choose with confidence"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. Good advice saves time and prevents costly mistakes"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Choosing a printer also defines a workflow. Clear requirements prevent unsuitable purchases and unnecessary upgrades."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "The advisor structures common requirements and identifies suitable models faster. For specialist projects, personal consultation is the best next step."
"cardnext.storefront.printer_advisor.guide.chapters.volume.list.small": "Low volumes: compact entry-level systems"
"cardnext.storefront.printer_advisor.guide.chapters.volume.list.medium": "Medium volumes: flexible all-rounders"
"cardnext.storefront.printer_advisor.guide.chapters.volume.list.high": "High volumes: powerful professional systems"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.list.magnetic": "Magnetic stripe for straightforward applications"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.list.contact_chip": "Contact chip for specific identification solutions"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.list.rfid_nfc": "RFID / NFC for modern access and ID systems"
