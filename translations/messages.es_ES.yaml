"cardnext.storefront.printer_advisor.guide.eyebrow": "Orientación antes de comprar"
"cardnext.storefront.printer_advisor.guide.title": "Guía de impresoras de tarjetas: aspectos que debe tener en cuenta"
"cardnext.storefront.printer_advisor.guide.lead": "Elegir una impresora de tarjetas depende de algo más que el precio. El volumen, las funciones de las tarjetas, la seguridad y la codificación son factores decisivos. El sistema adecuado ahorra tiempo, materiales e inversiones innecesarias a largo plazo."
"cardnext.storefront.printer_advisor.guide.intro": "Si aún no sabe qué impresora se adapta a su aplicación, nuestro asesor interactivo le orientará rápidamente con unas preguntas concretas."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Ir al asesor"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Planificar el volumen"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. El volumen previsto es un factor esencial"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "El volumen anual determina si basta un equipo de sobremesa compacto o si cobran importancia la velocidad, la resistencia y la facilidad de uso."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "Una impresora insuficiente alcanza pronto sus límites; un sistema de alto rendimiento suele ser poco rentable para tiradas pequeñas."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "El asesor pregunta primero este dato porque influye mucho en la selección."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Una cara o dúplex"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. ¿Impresión a una o doble cara?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "La impresión a una cara suele bastar para tarjetas sencillas de cliente o visitante. La información, los códigos de barras o la personalización del reverso requieren dúplex."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "El dúplex automático elimina tareas manuales y agiliza la producción habitual de tarjetas."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Indique una o doble cara para que solo se consideren sistemas adecuados."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Codificación inteligente"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. ¿Solo imprimir o también codificar?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "El acceso, el control horario y la identificación suelen exigir algo más que una imagen impresa."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "La banda magnética, el chip de contacto y RFID/NFC tienen requisitos distintos; no todas las impresoras admiten cada codificación."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "El asesor restringe la selección según la codificación necesaria."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Calidad y protección"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Impresión directa, retransfer y laminación explicadas"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "La impresión directa es una opción económica y contrastada para muchas aplicaciones estándar."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Retransfer crea imágenes sin bordes de alta calidad en superficies difíciles; la laminación protege del desgaste, los rayos UV y el uso diario."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "Estos requisitos permiten diferenciar correctamente los sistemas básicos y profesionales."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Rentabilidad a largo plazo"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. ¿Qué papel desempeña el presupuesto?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "El precio de compra no lo es todo: el sistema debe seguir siendo adecuado y cubrir necesidades futuras."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Los grandes volúmenes, el dúplex, la codificación o la seguridad suelen justificar un modelo más potente."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "El asesor tiene en cuenta el presupuesto y muestra recomendaciones y alternativas adecuadas."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Decidir con seguridad"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. Un buen asesoramiento ahorra tiempo y evita compras equivocadas"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Elegir impresora también define un proceso de trabajo. Unos requisitos claros evitan compras erróneas y ampliaciones innecesarias."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "El asesor estructura las necesidades habituales y localiza antes los modelos adecuados. Para proyectos especiales, el asesoramiento personal es el mejor paso siguiente."
