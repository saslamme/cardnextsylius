"cardnext.storefront.printer_advisor.guide.title": "Koopgids voor kaartprinters: waar moet u op letten?"
"cardnext.storefront.printer_advisor.guide.lead": "Bij de keuze van een kaartprinter speelt meer dan alleen de prijs. Vooral printvolume, kaartfuncties, beveiliging en eventuele codering zijn bepalend. Met het juiste systeem bespaart u op termijn tijd, materiaal en onnodige investeringen."
"cardnext.storefront.printer_advisor.guide.intro": "Weet u nog niet welke kaartprinter bij uw toepassing past? Onze interactieve advieswijzer helpt u snel verder met enkele gerichte vragen."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Naar de advieswijzer"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Printvolume plannen"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. Het geplande printvolume is een kernfactor"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "Het jaarvolume bepaalt of een compact desktopsysteem volstaat of dat snelheid, belastbaarheid en gebruiksgemak zwaarder wegen."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "Een te lichte printer bereikt snel zijn grenzen; voor kleine aantallen is een high-performance systeem vaak niet rendabel."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "Daarom vraagt de advieswijzer dit als eerste: het beïnvloedt de productkeuze sterk."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Enkelzijdig of duplex"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. Enkel- of dubbelzijdig printen?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "Voor eenvoudige klanten- of bezoekerspassen volstaat vaak enkelzijdig printen. Informatie, barcodes of personalisatie op de achterzijde vragen om duplex."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "Automatisch dubbelzijdig printen bespaart handwerk en stroomlijnt regelmatige kaartproductie."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Geef enkel- of dubbelzijdig aan, zodat alleen geschikte systemen meetellen."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Kaarten slim coderen"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. Alleen printen of ook coderen?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "Voor toegangscontrole, tijdregistratie en identificatie is vaak meer nodig dan alleen een zichtbare opdruk."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "Magneetstrip, contactchip en RFID/NFC stellen elk andere eisen; niet elke printer ondersteunt iedere codering."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "De advieswijzer beperkt de selectie op basis van de benodigde codering."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Printkwaliteit & bescherming"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Direct-to-card, retransfer en laminering uitgelegd"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "Direct-to-card is een economische, bewezen keuze voor veel standaardtoepassingen."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Retransfer levert hoogwaardige randloze beelden op lastige oppervlakken; laminering beschermt tegen slijtage, uv en dagelijks gebruik."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "Deze eisen maken een zinvol onderscheid tussen instap- en professionele systemen mogelijk."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Duurzaam rendabel"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. Welke rol speelt het budget?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "Niet alleen de aanschafprijs telt: het systeem moet blijvend passen en toekomstige eisen aankunnen."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Bij grotere volumes, duplex, codering of strengere beveiliging loont een krachtiger model vaak."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "De advieswijzer houdt rekening met uw investeringsruimte en toont passende adviezen en alternatieven."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Zeker beslissen"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. Goed advies bespaart tijd en voorkomt miskopen"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Met de printer kiest u ook een werkproces. Heldere eisen voorkomen miskopen en onnodige uitbreidingen."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "De advieswijzer structureert gangbare eisen en vindt sneller passende modellen. Voor specialistische projecten is persoonlijk advies de beste vervolgstap."
