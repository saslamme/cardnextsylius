"cardnext.storefront.printer_advisor.guide.eyebrow": "Vejledning før køb"
"cardnext.storefront.printer_advisor.guide.title": "Guide til kortprintere: det skal I overveje før køb"
"cardnext.storefront.printer_advisor.guide.lead": "Valget af kortprinter handler om mere end prisen. Printmængde, kortfunktioner, sikkerhedskrav og kodning er afgørende. Det rette system sparer på langt sigt tid, materialer og unødige investeringer."
"cardnext.storefront.printer_advisor.guide.intro": "Er I i tvivl om, hvilken printer der passer til opgaven, hjælper vores interaktive guide jer videre med få målrettede spørgsmål."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Gå til kortprinterguiden"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Planlæg printmængden"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. Den planlagte printmængde er afgørende"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "Årsmængden afgør, om en kompakt desktopmodel er nok, eller om hastighed, robusthed og brugervenlighed vægter højere."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "En for lille printer når hurtigt sin grænse; et højtydende system er ofte urentabelt ved små mængder."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "Guiden spørger om dette først, fordi det har stor betydning for produktvalget."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Enkeltsidet eller duplex"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. Print på én eller begge sider?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "Enkeltsidet print rækker ofte til enkle kunde- eller gæstekort. Oplysninger, stregkoder eller personalisering på bagsiden kræver duplex."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "Automatisk duplex fjerner manuelle trin og effektiviserer den løbende kortproduktion."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Angiv enkeltsidet eller dobbeltsidet, så kun egnede systemer indgår."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Intelligent kortkodning"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. Skal kortet kun printes eller også kodes?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "Adgang, tidsregistrering og identifikation kræver ofte mere end et synligt print."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "Magnetstribe, kontaktchip og RFID/NFC har forskellige krav, og ikke alle printere understøtter alle kodninger."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "Guiden afgrænser udvalget efter den kodning, I har brug for."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Printkvalitet og beskyttelse"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Direkte kortprint, retransfer og laminering forklaret"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "Direkte kortprint er en økonomisk og gennemprøvet løsning til mange standardopgaver."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Retransfer giver eksklusive kantløse motiver på vanskelige overflader, mens laminering beskytter mod slid, UV og daglig brug."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "Kravene bruges til at skelne meningsfuldt mellem begynder- og professionelle systemer."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Langsigtet økonomi"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. Hvilken rolle spiller budgettet?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "Anskaffelsesprisen er ikke alt; systemet skal passe på langt sigt og kunne rumme fremtidige behov."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Større mængder, duplex, kodning eller sikkerhedskrav gør ofte en kraftigere model til en god investering."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "Guiden tager højde for investeringsrammen og viser relevante anbefalinger og alternativer."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Træf et sikkert valg"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. God rådgivning sparer tid og forebygger fejlkøb"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Valget af printer fastlægger også en arbejdsgang. Klare krav forebygger fejlkøb og unødige opgraderinger."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "Guiden strukturerer typiske krav og finder hurtigere egnede modeller. Ved specialprojekter er personlig rådgivning det bedste næste skridt."
