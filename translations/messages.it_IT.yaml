"cardnext.storefront.printer_advisor.guide.eyebrow": "Orientamento prima dell’acquisto"
"cardnext.storefront.printer_advisor.guide.title": "Guida alle stampanti di carte: cosa valutare prima dell’acquisto"
"cardnext.storefront.printer_advisor.guide.lead": "La scelta di una stampante di carte non dipende solo dal prezzo. Contano soprattutto volumi, funzioni delle carte, requisiti di sicurezza e codifica. Il sistema giusto consente di risparmiare nel tempo, materiali e investimenti non necessari."
"cardnext.storefront.printer_advisor.guide.intro": "Se non sapete ancora quale stampante si adatta all’applicazione, il nostro consulente interattivo vi guida rapidamente con poche domande mirate."
"cardnext.storefront.printer_advisor.guide.advisor_cta": "Vai al consulente"
"cardnext.storefront.printer_advisor.guide.chapters.volume.media": "Pianificare i volumi"
"cardnext.storefront.printer_advisor.guide.chapters.volume.title": "1. Il volume previsto è un fattore fondamentale"
"cardnext.storefront.printer_advisor.guide.chapters.volume.p1": "Il volume annuo determina se basta un modello desktop compatto o se diventano prioritari velocità, robustezza e facilità d’uso."
"cardnext.storefront.printer_advisor.guide.chapters.volume.p2": "Una stampante sottodimensionata raggiunge presto i propri limiti; un sistema ad alte prestazioni è spesso antieconomico per piccoli volumi."
"cardnext.storefront.printer_advisor.guide.chapters.volume.note": "Il consulente parte da questo dato perché incide fortemente sulla selezione."
"cardnext.storefront.printer_advisor.guide.chapters.sides.media": "Fronte o fronte-retro"
"cardnext.storefront.printer_advisor.guide.chapters.sides.title": "2. Stampa su uno o due lati?"
"cardnext.storefront.printer_advisor.guide.chapters.sides.p1": "La stampa su un lato basta spesso per semplici tessere cliente o visitatore. Informazioni, codici a barre o dati sul retro richiedono il fronte-retro."
"cardnext.storefront.printer_advisor.guide.chapters.sides.p2": "Il fronte-retro automatico elimina operazioni manuali e rende più efficiente la produzione regolare."
"cardnext.storefront.printer_advisor.guide.chapters.sides.note": "Indicate uno o due lati affinché vengano considerati solo i sistemi adatti."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.media": "Codifica intelligente"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.title": "3. Solo stampa o anche codifica?"
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p1": "Controllo accessi, rilevazione presenze e identificazione richiedono spesso più di un’immagine stampata."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.p2": "Banda magnetica, chip a contatto e RFID/NFC hanno requisiti diversi; non tutte le stampanti supportano ogni codifica."
"cardnext.storefront.printer_advisor.guide.chapters.encoding.note": "Il consulente restringe la scelta in base alla codifica necessaria."
"cardnext.storefront.printer_advisor.guide.chapters.quality.media": "Qualità e protezione"
"cardnext.storefront.printer_advisor.guide.chapters.quality.title": "4. Stampa diretta, retransfer e laminazione in breve"
"cardnext.storefront.printer_advisor.guide.chapters.quality.p1": "La stampa diretta è una soluzione economica e collaudata per molte applicazioni standard."
"cardnext.storefront.printer_advisor.guide.chapters.quality.p2": "Il retransfer produce immagini senza bordi su superfici difficili; la laminazione protegge da abrasione, raggi UV e uso quotidiano."
"cardnext.storefront.printer_advisor.guide.chapters.quality.note": "Questi requisiti consentono di distinguere correttamente sistemi base e professionali."
"cardnext.storefront.printer_advisor.guide.chapters.budget.media": "Convenienza nel tempo"
"cardnext.storefront.printer_advisor.guide.chapters.budget.title": "5. Che ruolo ha il budget?"
"cardnext.storefront.printer_advisor.guide.chapters.budget.p1": "Il prezzo iniziale non è l’unico criterio: il sistema deve restare adeguato e coprire esigenze future."
"cardnext.storefront.printer_advisor.guide.chapters.budget.p2": "Volumi elevati, fronte-retro, codifica o sicurezza rendono spesso conveniente un modello più performante."
"cardnext.storefront.printer_advisor.guide.chapters.budget.note": "Il consulente considera il budget e mostra consigli e alternative adeguati."
"cardnext.storefront.printer_advisor.guide.chapters.advice.media": "Scegliere con sicurezza"
"cardnext.storefront.printer_advisor.guide.chapters.advice.title": "6. Una buona consulenza evita perdite di tempo e acquisti errati"
"cardnext.storefront.printer_advisor.guide.chapters.advice.p1": "Scegliere una stampante significa definire anche un flusso di lavoro. Requisiti chiari evitano acquisti errati e aggiornamenti inutili."
"cardnext.storefront.printer_advisor.guide.chapters.advice.p2": "Il consulente organizza le esigenze tipiche e individua più rapidamente i modelli adatti. Per progetti speciali, il passo successivo migliore è una consulenza personale."
