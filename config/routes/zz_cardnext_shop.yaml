# Loaded after Sylius' shop routes. Both established route names generate the
# same flat URL; the Cardnext resolver decides whether the slug is a taxon or a
# product before delegating to Sylius' unchanged resource controllers.

cardnext_shop_product_compare:
    path: /produktvergleich
    controller: App\Controller\Shop\ProductComparisonController
    methods: [GET]

sylius_shop_product_index:
    path: /{slug}
    controller: App\Controller\Shop\PublicSlugController
    methods: [GET]
    requirements: &public_slug_requirements
        slug: '[^/]+'

sylius_shop_product_show:
    path: /{slug}
    controller: App\Controller\Shop\PublicSlugController
    methods: [GET]
    requirements: *public_slug_requirements

# Deliberately last, with reserved application namespaces excluded at the routing
# boundary. This is the deterministic multi-segment fallback: its controller
# tries a configurator first and then the CMS resolver. Single-segment requests
# use PublicSlugController, whose fixed ownership order is taxon, product, CMS
# page, CMS redirect. Thus CMS content can never shadow a catalog resource.
cardnext_shop_configurator_page:
    path: /{configuratorPath}
    controller: App\Controller\Shop\ConfiguratorPageController
    methods: [GET]
    requirements:
        configuratorPath: '(?!(?:admin|api|angebot|downloads)(?:/|$)|_).+'
