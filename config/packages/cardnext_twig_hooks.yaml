sylius_twig_hooks:
    hooks:
        'sylius_shop.base.header':
            top_bar:
                template: 'shop/layout/header/top_bar.html.twig'
                priority: 300
            content:
                template: 'shop/layout/header/content.html.twig'
                priority: 200
            navbar:
                template: 'shop/layout/header/empty.html.twig'
                priority: 100

        'sylius_shop.base.footer':
            content:
                template: 'shop/layout/footer/content.html.twig'
                priority: 0

        'sylius_shop.cart.index.content.form.sections.general.summary':
            configured_items_total:
                template: 'shop/cart/configured_items_total.html.twig'
                priority: 450

        'sylius_shop.base.offcanvas.cart':
            footer:
                template: 'shop/layout/offcanvas/cart/footer.html.twig'
                priority: 0

        'sylius_shop.base.offcanvas.cart.body':
            items:
                template: 'shop/layout/offcanvas/cart/body/items.html.twig'
                priority: 0

        'sylius_shop.checkout.common.sidebar.summary.items':
            configured_items:
                template: 'shop/checkout/sidebar/configured_items.html.twig'
                priority: -100

        'sylius_shop.checkout.common.sidebar.summary.total':
            configured_items_total:
                template: 'shop/checkout/sidebar/configured_items_total.html.twig'
                priority: 350

        'sylius_shop.shared.order.show.summary.table':
            configured_items:
                template: 'shop/checkout/complete/configured_items.html.twig'
                priority: 50

        'sylius_shop.shared.order.show.summary.table_summary':
            configured_items_total:
                template: 'shop/checkout/complete/configured_items_total.html.twig'
                priority: 450
