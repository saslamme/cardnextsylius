sylius_twig_hooks:
    hooks:
        'sylius_shop.product.show.content.info':
            overview:
                template: '@SyliusShop/product/show/content/info/overview.html.twig'
                priority: 200
            summary:
                component: 'sylius_shop:product:summary'
                props:
                    product: '@=_context.product'
                    template: '@SyliusShop/product/show/content/info/summary.html.twig'
                priority: 100
        'sylius_shop.product.show.content.info.summary':
            leasing:
                template: 'shop/product/_leasing.html.twig'
                # Keep leasing after Sylius' complete purchase component (priority 100)
                # and every other standard summary section, including the short description.
                priority: -200
        'sylius_shop.product.show.content':
            bundles:
                template: 'shop/product/_bundles.html.twig'
                priority: 50
