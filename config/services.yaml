# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    cardnext.quote_recipient: '%env(CARDNEXT_QUOTE_RECIPIENT)%'
    cardnext.quote_account_base_urls:
        CARDNEXT_DE: 'https://www.cardnext.de'
        CARDNEXT_AT: 'https://at.cardnext.de'
    # Structured source for all legal and contact details printed on quote PDFs.
    # Deliberately keep unknown details empty; never derive these from legal-page HTML.
    cardnext.quote_issuer_profiles:
        CARDNEXT_DE:
            company: 'Cardnext'
            street: null
            postalCode: null
            city: null
            country: 'Deutschland'
            email: null
            phone: null
            website: 'www.cardnext.de'
            vatId: null
            registrationCourt: null
            registrationNumber: null
            managingDirector: null
            bankName: null
            iban: null
            bic: null
        CARDNEXT_AT:
            company: 'Cardnext'
            street: null
            postalCode: null
            city: null
            country: 'Österreich'
            email: null
            phone: null
            website: 'www.cardnext.at'
            vatId: null
            registrationCourt: null
            registrationNumber: null
            managingDirector: null
            bankName: null
            iban: null
            bic: null

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Form\Type\LegalPageType:
        arguments:
            $localeRepository: '@sylius.repository.locale'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Service\Quote\QuoteRequestMailer:
        arguments:
            $recipient: '%cardnext.quote_recipient%'

    App\Service\Quote\QuoteIssuerProfileRegistry:
        arguments:
            $profiles: '%cardnext.quote_issuer_profiles%'

    App\Service\Quote\QuoteOfferMailer:
        arguments:
            $recipient: '%cardnext.quote_recipient%'
            $projectDir: '%kernel.project_dir%'

    App\Service\Quote\QuoteAccountUrlGenerator:
        arguments:
            $baseUrls: '%cardnext.quote_account_base_urls%'

    App\Service\Quote\QuoteOrderConverter:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $orderFactory: '@sylius.custom_factory.order'
            $orderItemFactory: '@sylius.custom_factory.order_item'
            $quantityModifier: '@sylius.modifier.order_item_quantity'
            $adjustmentFactory: '@sylius.factory.adjustment'
            $addressFactory: '@sylius.factory.address'
            $channelRepository: '@sylius.repository.channel'
            $numberAssigner: '@sylius.number_assigner.order_number'
